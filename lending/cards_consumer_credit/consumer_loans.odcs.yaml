# Data contract (ODCS v3.2) for the tables of consumer_loans.sqrl. DataSQRL checks the connector
# tables of consumer_loans-test.sqrl and consumer_loans-prod.sqrl against it when it compiles.
apiVersion: v3.2.0
kind: DataContract
id: "urn:retail-bank:datacontract:consumer_loans"
name: Consumer Loans
version: 1.0.0
status: active
domain: lending
team:
  name: Cards & Consumer Credit
  description: Lending line of business
description:
  purpose: >-
    Personal and auto loan data including loan applications, funded loans, payment history, and
    delinquency tracking. Supports the full consumer lending lifecycle from application through
    payoff or charge-off. Data is a CDC stream from source system.
customProperties:
  - property: layer
    value: bronze
  - property: classification
    value: Restricted
  - property: regulatoryScope
    value: [GLBA, GDPR, CCPA, FCRA, TILA, ECOA, SCRA]
schema:
  - name: Personal_Loan
    physicalName: consumer_loans.personal_loan
    physicalType: topic
    logicalType: object
    description: Personal/unsecured loan records.
    dataGranularityDescription: one row per loan_id
    properties:
      - name: loan_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Unique identifier for the loan
      - name: application_id
        logicalType: string
        physicalType: STRING
        description: Reference to application
      - name: primary_borrower_customer_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Reference to primary borrower
        tags: [pii]
      - name: loan_number
        logicalType: string
        physicalType: STRING
        required: true
        description: Loan number displayed to customer
        tags: [mask, npi]
      - name: loan_status
        logicalType: string
        physicalType: STRING
        required: true
        description: "Loan status: ACTIVE, PAID_OFF, CHARGED_OFF, SETTLED"
      - name: loan_purpose
        logicalType: string
        physicalType: STRING
        description: "Loan purpose: DEBT_CONSOLIDATION, HOME_IMPROVEMENT, MAJOR_PURCHASE, MEDICAL, VACATION, OTHER"
      - name: original_amount_cents
        logicalType: integer
        logicalTypeOptions:
          format: i64
        physicalType: BIGINT
        required: true
        description: Original loan amount in cents
        tags: [confidential, npi]
      - name: current_balance_cents
        logicalType: integer
        logicalTypeOptions:
          format: i64
        physicalType: BIGINT
        required: true
        description: Current principal balance in cents
        tags: [confidential, npi]
      - name: interest_rate
        logicalType: number
        physicalType: DECIMAL(6, 4)
        required: true
        description: Interest rate (APR)
        tags: [confidential]
      - name: rate_type
        logicalType: string
        physicalType: STRING
        required: true
        description: "Rate type: FIXED, VARIABLE"
      - name: original_term_months
        logicalType: integer
        logicalTypeOptions:
          format: i32
        physicalType: INT
        required: true
        description: Original term in months
      - name: remaining_term_months
        logicalType: integer
        logicalTypeOptions:
          format: i32
        physicalType: INT
        description: Remaining term in months
      - name: monthly_payment_cents
        logicalType: integer
        logicalTypeOptions:
          format: i64
        physicalType: BIGINT
        required: true
        description: Monthly payment amount in cents
        tags: [confidential, npi]
      - name: funding_date
        logicalType: date
        physicalType: DATE
        required: true
        description: Date loan was funded
      - name: first_payment_date
        logicalType: date
        physicalType: DATE
        required: true
        description: First payment due date
      - name: maturity_date
        logicalType: date
        physicalType: DATE
        required: true
        description: Maturity date
      - name: next_payment_due_date
        logicalType: date
        physicalType: DATE
        description: Next payment due date
      - name: paid_off_date
        logicalType: date
        physicalType: DATE
        description: Date loan was paid off
      - name: origination_fee_cents
        logicalType: integer
        logicalTypeOptions:
          format: i64
        physicalType: BIGINT
        description: Origination fee in cents
      - name: credit_score_at_origination
        logicalType: integer
        logicalTypeOptions:
          format: i32
        physicalType: INT
        description: Credit score at origination
        tags: [confidential, npi]
      - name: dti_at_origination
        logicalType: number
        physicalType: DECIMAL(5, 2)
        description: DTI ratio at origination
        tags: [confidential, npi]
      - name: autopay_enrolled
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: Autopay enrolled
      - name: disbursement_account_id
        logicalType: string
        physicalType: STRING
        description: Disbursement account
        tags: [npi]
      - name: payment_account_id
        logicalType: string
        physicalType: STRING
        description: Payment account
        tags: [npi]
      - name: origination_channel
        logicalType: string
        physicalType: STRING
        description: "Origination channel: ONLINE, BRANCH, PHONE, PARTNER"
      - name: source_system
        logicalType: string
        physicalType: STRING
        required: true
        description: Source system identifier
      - name: source_updated_at
        logicalType: timestamp
        logicalTypeOptions:
          timezone: true
        physicalType: TIMESTAMP_LTZ(3)
        required: true
        description: Timestamp when record was last updated in source system
