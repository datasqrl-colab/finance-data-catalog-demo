name: Build and test finance-catalog

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  TZ: 'America/Los_Angeles'
  SQRL_VERSION: '0.11.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Compile ontology
        run: ./run-tests.sh --compile

      - name: Test ontology
        run: ./run-tests.sh
